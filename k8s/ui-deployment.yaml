apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: library-ui
  template:
    metadata:
      labels:
        app: library-ui
    spec:
      containers:
        - name: ui
          image: library-ui:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080